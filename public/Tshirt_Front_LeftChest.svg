<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1050" viewBox="0 0 1050 1050">
  <!-- Black backdrop (simulates black shirt) -->
  <rect width="1050" height="1050" fill="#0a0a0a"/>
  
  <!-- Icon + MOBILEYES wordmark horizontal -->
  <circle cx="370" cy="460" r="28" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="370" cy="460" r="18" fill="none" stroke="#F97316" stroke-width="1" opacity="0.4"/>
  <circle cx="370" cy="460" r="10" fill="#EF4444"/>
  <text x="410" y="470" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">MOBILEYES</text>
  
  <!-- Represent. Perform. Get paid. — horizontal underneath, small -->
  <text x="370" y="530" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Represent.</text>
  <text x="470" y="530" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#EF4444">Perform.</text>
  <text x="558" y="530" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Get paid.</text>
</svg>