<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650">
  <!-- Background: #1A0008 warm dark (RED system) -->
  <rect width="1050" height="650" fill="#1A0008"/>
  
  <!-- Large centred MBIcon -->
  <circle cx="525" cy="260" r="60" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="525" cy="260" r="40" fill="none" stroke="#F97316" stroke-width="1" opacity="0.3"/>
  <circle cx="525" cy="260" r="22" fill="#EF4444"/>
  
  <!-- MOBILEYES wordmark centred -->
  <text x="525" y="365" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="0.8" text-anchor="middle">MOBILEYES</text>
  
  <!-- Stacked positioning centred -->
  <text x="525" y="440" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Represent.</text>
  <text x="525" y="476" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#EF4444" text-anchor="middle">Perform.</text>
  <text x="525" y="512" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Get paid.</text>
  
  <!-- Subtitle -->
  <text x="525" y="580" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.45)" text-anchor="middle">Live streaming talent — Sydney, AU</text>
</svg>